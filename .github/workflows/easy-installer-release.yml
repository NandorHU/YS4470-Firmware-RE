name: Build and publish Windows installer
on:
  push:
    branches: [release/easy-installer-1.1]
    paths: ['installer/**', 'patcher/**', '.github/workflows/easy-installer-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ys4470-installer-release
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'NandorHU/YS4470-Firmware-RE'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned build tools
        run: python -m pip install -r installer/requirements-build.lock.txt
      - name: Fetch public SHA-pinned inputs
        run: python installer/prepare.py
      - name: Test public patcher against both originals
        run: python -m unittest discover -s patcher -p test_patcher.py -v
      - name: Build packaged English GUI
        run: python installer/build.py
      - name: Audit runtime and simulate installation/recovery
        run: python installer/verify_release.py
      - name: Publish new beta Release
        if: github.ref == 'refs/heads/release/easy-installer-1.1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'installer-v1.1.0-beta.2'
          $all = gh api 'repos/NandorHU/YS4470-Firmware-RE/releases?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases' }
          if (@($all | Where-Object { $_.tag_name -eq $tag }).Count -ne 0) { throw 'Release already exists; refusing asset overwrite' }
          $assets = @(Get-ChildItem -LiteralPath work/easy-installer/release -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --repo NandorHU/YS4470-Firmware-RE --target ${{ github.sha }} --draft --prerelease --title 'YS-4470 English Installer 1.1.0-beta.2 (factory V3.8 included)' --notes-file installer/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          $all = gh api 'repos/NandorHU/YS4470-Firmware-RE/releases?per_page=100' | ConvertFrom-Json
          $draft = @($all | Where-Object { $_.tag_name -eq $tag -and $_.draft })
          if ($draft.Count -ne 1) { throw 'Created draft not found by release ID' }
          $id = $draft[0].id
          $valid = $false
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            $release = gh api repos/NandorHU/YS4470-Firmware-RE/releases/$id | ConvertFrom-Json
            $valid = $release.assets.Count -eq $assets.Count
            foreach ($file in $assets) {
              $name = [IO.Path]::GetFileName($file)
              $asset = @($release.assets | Where-Object { $_.name -eq $name })
              $expected = 'sha256:' + (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($asset.Count -ne 1 -or $asset[0].digest -ne $expected) { $valid = $false }
            }
            if ($valid) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $valid) { throw 'Uploaded asset verification failed; draft retained' }
          gh api --method PATCH repos/NandorHU/YS4470-Firmware-RE/releases/$id -F draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish verified draft' }

