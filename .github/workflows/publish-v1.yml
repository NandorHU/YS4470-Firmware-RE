name: Publish verified YS-4470 1.0 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-ys4470-v1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify firmware package and publish Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        shell: python
        run: |
          """One-time GitHub Actions release publication, no third-party packages."""
          import base64,hashlib,io,json,os,sys,urllib.request,urllib.error,zipfile
          from pathlib import Path
          REPO='NandorHU/YS4470-Firmware-RE'
          BLOB='5659f725bb28258db56fb64d88affaadbb2e58d0'
          SHA256='d336adcb687a1f53695cf1cf98419265f284f97ded2690449f2553fe1e50c038'
          NAME='YS4470-highspeedv2-1.0-Windows.zip'
          TAG='v1.0'
          NOTES='''## YS-4470 highspeedv2 - 1.0
          
          - Retains Beta3's faster diode measurement and display updates.
          - Continuous 1321 Hz diode tone and the highspeedv2 switch label.
          - Reproducible Windows FEL installer preparation and Beta3 rollback, with full backups, complete readback verification, and percentage progress.
          
          **I tested this build on the device and confirmed that version 1.0 works well.** The complete 16 MiB flash readback matched the intended image byte for byte. Quantitative latency measurements and complete measurement-accuracy regression testing remain outstanding.
          
          ### Download and installation
          
          Download YS4470-highspeedv2-1.0-Windows.zip below. Compiled firmware components are in firmware/; the reproducible installer project is in project/.
          
          Read OLVASS-EL.txt before installation. Preparing the tested installer requires your own exact, hash-verified Beta3 full backup and the pinned sunxi-fel.exe. Unknown device states are rejected. Installation through the factory updater has not been verified. The build also modifies the bootloader; interrupted writing may require FEL recovery.
          
          The package contains no personal full flash backup, device logs, or external native executable tools. Compiled builds are available only as Release assets, outside the source tree. SHA256SUMS.txt provides the archive checksum.
          
          Firmware source baseline: 30600195b40af4c6bd179e696518320d9abb4740.
          '''
          def validate(data):
              if hashlib.sha256(data).hexdigest()!=SHA256:raise ValueError('Release ZIP SHA-256 mismatch')
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  if z.testzip() is not None:raise ValueError('Corrupt ZIP')
                  for n in z.namelist():
                      parts=Path(n).parts
                      if any(p in ['inputs','out','tools','simulation'] or p.startswith('run-') for p in parts) or '..' in parts:raise ValueError('Unexpected private/archive path')
                  expected={'firmware/f1c100s-1.0.bin','firmware/boot0-1.0.bin','firmware/logo-1.0.bin'}
                  if {n for n in z.namelist() if n.endswith('.bin')}!=expected:raise ValueError('Unexpected firmware list')
                  if hashlib.sha256(z.read('firmware/f1c100s-1.0.bin')).hexdigest()!='697d160047e9f040b31acd79d5b0febb940bc712f15eb6e2d91d997a5608011d':raise ValueError('Wrong main firmware')
                  for line in z.read('CHECKSUMS.sha256').decode().splitlines():
                      digest,name=line.split('  ',1)
                      if hashlib.sha256(z.read(name)).hexdigest()!=digest:raise ValueError('File checksum mismatch: '+name)
          def api(path,method='GET',data=None,raw=False):
              url=path if path.startswith('https://uploads.github.com/') else 'https://api.github.com/repos/'+REPO+path
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'YS4470-release-1.0'}
              if data is not None:
                  headers['Content-Type']='application/octet-stream' if raw else 'application/json'
                  if not raw:data=json.dumps(data).encode()
              request=urllib.request.Request(url,data=data,headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=90) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          def publish():
              blob=api('/git/blobs/'+BLOB)
              if blob.get('encoding')!='base64':raise ValueError('Expected base64 blob')
              data=base64.b64decode(blob['content']);validate(data)
              try:
                  release=api('/releases/tags/'+TAG)
                  if release['name']!='YS-4470 highspeedv2 1.0':raise ValueError('Existing release title mismatch; refusing overwrite')
              except urllib.error.HTTPError as error:
                  if error.code!=404:raise
                  release=api('/releases','POST',dict(tag_name=TAG,target_commitish=os.environ['GITHUB_SHA'],name='YS-4470 highspeedv2 1.0',body=NOTES,draft=True,prerelease=False))
              assets=[(NAME,data),('SHA256SUMS.txt',(SHA256+'  '+NAME+'\n').encode())]
              existing={a['name']:a for a in release.get('assets',[])}
              for name,content in assets:
                  digest='sha256:'+hashlib.sha256(content).hexdigest()
                  if name in existing:
                      if existing[name].get('digest')==digest:continue
                      approved_previous={'YS4470-highspeedv2-1.0-Windows.zip':'sha256:326712f3c97240a28383de042be799e7f9bb820ef0c94c271254845d5e525f52','SHA256SUMS.txt':'sha256:c5898949bc40f43991c03b1e838111787489b8d22d549a09b0427bffb4296b1d'}
                      if existing[name].get('digest')!=approved_previous.get(name):raise ValueError('Unexpected existing asset; refusing replacement')
                      api('/releases/assets/'+str(existing[name]['id']),'DELETE')
                  url=release['upload_url'].split('{')[0]+'?name='+name
                  if not url.startswith('https://uploads.github.com/repos/'+REPO+'/releases/'):raise ValueError('Unexpected upload destination')
                  asset=api(url,'POST',content,raw=True)
                  if asset['size']!=len(content) or asset.get('digest')!=digest:raise ValueError('Uploaded asset mismatch')
              api('/releases/'+str(release['id']),'PATCH',dict(body=NOTES,draft=False,prerelease=False,make_latest='true'))
              actual=api('/releases/'+str(release['id']))
              if actual['draft'] or actual['tag_name']!=TAG:raise ValueError('Release not published')
              for name,content in assets:
                  a=next(a for a in actual['assets'] if a['name']==name)
                  if a.get('digest')!='sha256:'+hashlib.sha256(content).hexdigest():raise ValueError('Final remote digest mismatch')
              # Keep the release's source-code downloads on the same documentation revision.
              tag=api('/git/ref/tags/'+TAG)
              tag_sha=tag['object']['sha']
              if tag_sha!=os.environ['GITHUB_SHA']:
                  if tag_sha!='b87adb2f5c482f383770cb64c7407e05227cb363':raise ValueError('Unexpected release tag; refusing update')
                  api('/git/refs/tags/'+TAG,'PATCH',dict(sha=os.environ['GITHUB_SHA'],force=False))
              print('Published and verified:',actual['html_url'])
          if __name__=='__main__':
              if len(sys.argv)==3 and sys.argv[1]=='--verify-only':
                  validate(Path(sys.argv[2]).read_bytes());print('PASS: archive SHA256, firmware bytes, per-file hashes and private-data exclusion')
              else:publish()
